<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星澈">
<meta name="theme-color" content="#FFD60A">
<title>星澈 · 工作台</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href='/manifest.json'>
<style>
/* ========== 设计系统(绿色主题) ========== */
:root {
  --bg-primary: #E8F5E9;
  --bg-secondary: #C8E6C9;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F1F8E9;
  --text-primary: #1B5E20;
  --text-secondary: #388E3C;
  --text-muted: #66BB6A;
  --accent: #2E7D32;
  --accent-soft: #1B5E20;
  --border: #A5D6A7;
  --border-soft: #C8E6C9;
  --danger: #C0392B;
  --success: #2E7D32;
  --shadow: rgba(27, 94, 32, 0.08);
  --shadow-strong: rgba(27, 94, 32, 0.15);
  --radius: 14px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body { min-height: 100vh; }

/* ========== 布局 ========== */
.app {
  display: flex;
  min-height: 100vh;
}

/* ========== 侧边栏 ========== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  overflow-y: auto;
  transition: transform 0.3s ease;
}

.sidebar-header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.sidebar-logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 6px;
  color: var(--text-primary);
  font-family: var(--font-serif);
}

.sidebar-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 2px;
}

.sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  list-style: none;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  margin-bottom: 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  transition: all 0.18s ease;
  user-select: none;
  position: relative;
}

.nav-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--accent);
  color: var(--bg-primary);
  font-weight: 600;
}

.nav-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--border-soft);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 700;
  margin-right: 10px;
  flex-shrink: 0;
}

.nav-item.active .nav-num {
  background: var(--bg-primary);
  color: var(--accent);
}

.nav-label { flex: 1; }

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.sidebar-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}

.sidebar-btn:hover { background: var(--accent); color: var(--bg-primary); }

/* ========== 主内容区 ========== */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg-primary);
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(10px);
}

.topbar-left { display: flex; align-items: center; gap: 14px; }

.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--accent);
  cursor: pointer;
  padding: 4px;
}

.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}

.page-date {
  font-size: 13px;
  color: var(--text-muted);
  margin-left: 12px;
}

.topbar-right { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
  font-family: var(--font);
}

.icon-btn:hover { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }

.content {
  flex: 1;
  padding: 28px 32px 48px;
  max-width: 960px;
  width: 100%;
}

/* ========== 通用组件 ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px var(--shadow);
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title::before {
  content: "";
  width: 4px;
  height: 16px;
  background: var(--accent);
  border-radius: 2px;
}

.input, .textarea, .select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  transition: border-color 0.15s;
}

.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--accent);
}

.textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

.label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--bg-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}

.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-outline {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}

.btn-danger { background: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.row { display: flex; gap: 12px; }
.col { flex: 1; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* 列表项 */
.list-item {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.15s;
}

.list-item:hover { border-color: var(--border); box-shadow: 0 2px 6px var(--shadow); }

.list-item-content { flex: 1; min-width: 0; }

.list-item-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; word-break: break-word; }
.list-item-meta { font-size: 12px; color: var(--text-muted); }
.list-item-body { font-size: 13px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; word-break: break-word; }

.delete-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  padding: 0 4px;
  flex-shrink: 0;
  transition: color 0.15s;
}
.delete-btn:hover { color: var(--danger); }

/* 复选框 */
.checkbox {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all 0.15s;
  background: var(--bg-card);
}
.checkbox.checked { background: var(--accent); border-color: var(--accent); color: var(--bg-primary); }
.checkbox.checked::after { content: "✓"; font-size: 13px; font-weight: 700; }

.completed-text { text-decoration: line-through; color: var(--text-muted); }

/* 空状态 */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-num { font-size: 28px; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* 标签 */
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-secondary);
  color: var(--text-secondary);
}
.tag-dark { background: var(--accent); color: var(--bg-primary); }

/* 心情emoji选择 */
.mood-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.mood-option {
  font-size: 28px;
  padding: 8px 12px;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: var(--bg-card);
  transition: all 0.15s;
}
.mood-option.selected { border-color: var(--accent); background: var(--bg-card-hover); transform: scale(1.1); }

/* 评分 */
.rating { display: flex; gap: 4px; }
.star { font-size: 22px; cursor: pointer; color: var(--border); transition: color 0.15s; }
.star.active { color: #E89500; }

/* 进度条 */
.progress-bar { width: 100%; height: 8px; background: var(--border-soft); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }

/* 滑块美化 */
input[type="range"] { -webkit-appearance: none; height: 6px; background: var(--border-soft); border-radius: 3px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg-card); box-shadow: 0 1px 4px var(--shadow); }

/* 分类标签按钮 */
.tag-btn {
  display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);
  cursor:pointer;user-select:none;transition:all 0.15s;
}
.tag-btn:active { transform:scale(0.95); }
.tag-btn.active { background:var(--accent);color:#fff;border-color:var(--accent); }

/* 遮罩 */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 99;
}
.overlay.show { display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--accent);
  color: var(--bg-primary);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  z-index: 1000;
  transition: transform 0.3s;
  box-shadow: 0 4px 12px var(--shadow-strong);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ========== 移动端 ========== */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); box-shadow: 2px 0 20px var(--shadow-strong); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .menu-toggle { display: block; }
  .content { padding: 20px 16px 40px; }
  .topbar { padding: 14px 16px; }
  .page-title { font-size: 18px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .row { flex-direction: column; }
}

/* PWA 桌面模式 */
@media (display-mode: standalone) {
  body { user-select: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">星澈</div>
      <div class="sidebar-sub">WORKBuddy · 工作台</div>
    </div>
    <ul class="sidebar-nav" id="nav"></ul>
    <div class="sidebar-footer">
      <button class="sidebar-btn" onclick="exportData()">导出</button>
      <button class="sidebar-btn" onclick="document.getElementById('importFile').click()">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <span class="page-title" id="pageTitle">每日计划</span>
        <span class="page-date" id="pageDate"></span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="scrollToTop()">顶部</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 数据层 ====================
const STORAGE_KEY = 'xingche_workbench_v1';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data || {}));
}
function getPageData(page) {
  const all = loadData();
  return all[page] || [];
}
function setPageData(page, arr) {
  const all = loadData();
  all[page] = arr;
  saveData(all);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// 首次启动时初始化「人生清单」预设数据
function initLifeList() {
  const existing = getPageData('lifeList');
  if (existing.length > 0) {
    // 检查是否有被误删的预设目标(如存款50w),自动补回
    const presetTexts = ['存款 50w','月入三万,交社保','培养输出型爱好,雅思 6.5','保持在 96 斤','情绪稳定','晚上 11 点睡觉','穿有气质的衣服','妆容精致,会画眼妆','找个喜欢的人谈恋爱','出国玩','学会游泳','学会开车'];
    const existingTexts = existing.map(x => x.text);
    let needFix = false;
    presetTexts.forEach(t => {
      if (!existingTexts.includes(t)) {
        const presets = getLifeListPresets();
        const preset = presets.find(p => p.text === t);
        if (preset) {
          existing.push({ id: uid(), date: todayStr(), ...preset });
          needFix = true;
        }
      }
    });
    // 给已有目标补充每日任务(如果没有的话)
    const presets = getLifeListPresets();
    existing.forEach(g => {
      if (!g.dailyTasks || g.dailyTasks.length === 0) {
        const preset = presets.find(p => p.text === g.text);
        if (preset && preset.dailyTasks && preset.dailyTasks.length > 0) {
          g.dailyTasks = preset.dailyTasks.map(t => ({ ...t, id: uid() }));
          needFix = true;
        }
      }
    });
    if (needFix) {
      setPageData('lifeList', existing);
    }
    return;
  }
  const presets = getLifeListPresets();
  const list = presets.map(p => ({ id: uid(), date: todayStr(), ...p }));
  setPageData('lifeList', list);
}
function getLifeListPresets() {
  return [
    { text: '存款 50w', category: '财务', deadline: '2027-01-26', note: '已存 27w', progress: 54, currentValue: '27w', targetValue: '50w', done: false, dailyTasks: [
      { id: uid(), text: '记账,记录今日支出', reward: 1 },
      { id: uid(), text: '存下至少 500 元', reward: 2 },
    ]},
    { text: '月入三万,交社保', category: '事业', deadline: '', note: '', progress: 0, currentValue: '', targetValue: '月入3w', done: false, dailyTasks: [
      { id: uid(), text: '更新一篇内容/接一个商单', reward: 2 },
      { id: uid(), text: '复盘今日收入', reward: 1 },
    ]},
    { text: '培养输出型爱好,雅思 6.5', category: '学习', deadline: '2027-01-26', note: '', progress: 0, currentValue: '', targetValue: '雅思6.5', done: false, dailyTasks: [
      { id: uid(), text: '背 50 个单词', reward: 2 },
      { id: uid(), text: '听力练习 30 分钟', reward: 2 },
      { id: uid(), text: '口语练习 15 分钟', reward: 1 },
    ]},
    { text: '保持在 96 斤', category: '健康', deadline: '2027-01-26', note: '', progress: 0, currentValue: '', targetValue: '96斤', done: false, dailyTasks: [
      { id: uid(), text: '运动 30 分钟', reward: 2 },
      { id: uid(), text: '控制饮食,不吃高热量', reward: 1 },
      { id: uid(), text: '称体重记录', reward: 1 },
    ]},
    { text: '情绪稳定', category: '健康', deadline: '', note: '', progress: 0, currentValue: '', targetValue: '', done: false, dailyTasks: [
      { id: uid(), text: '冥想/深呼吸 5 分钟', reward: 2 },
      { id: uid(), text: '写感恩日记 3 件事', reward: 1 },
    ]},
    { text: '晚上 11 点睡觉', category: '健康', deadline: '', note: '', progress: 0, currentValue: '', targetValue: '23:00', done: false, dailyTasks: [
      { id: uid(), text: '10:30 前放下手机', reward: 2 },
      { id: uid(), text: '完成洗漱护肤', reward: 1 },
    ]},
    { text: '穿有气质的衣服', category: '形象', deadline: '', note: '', progress: 0, currentValue: '', targetValue: '', done: false, dailyTasks: [
      { id: uid(), text: '提前搭配明日穿搭', reward: 1 },
      { id: uid(), text: '整理衣柜,淘汰旧衣', reward: 1 },
    ]},
    { text: '妆容精致,会画眼妆', category: '形象', deadline: '', note: '', progress: 0, currentValue: '', targetValue: '', done: false, dailyTasks: [
      { id: uid(), text: '练习眼妆 15 分钟', reward: 2 },
      { id: uid(), text: '卸妆护肤', reward: 1 },
    ]},
    { text: '找个喜欢的人谈恋爱', category: '情感', deadline: '2027-01-26', note: '', progress: 0, currentValue: '', targetValue: '', done: false, dailyTasks: [
      { id: uid(), text: '社交/认识新朋友', reward: 1 },
      { id: uid(), text: '主动和感兴趣的人聊天', reward: 2 },
    ]},
    { text: '出国玩', category: '体验', deadline: '', note: '✅ 已去了泰国', progress: 100, currentValue: '泰国', targetValue: '', done: true, dailyTasks: [] },
    { text: '学会游泳', category: '健康', deadline: '', note: '', progress: 100, currentValue: '', targetValue: '', done: true, dailyTasks: [] },
    { text: '学会开车', category: '体验', deadline: '', note: '', progress: 100, currentValue: '', targetValue: '', done: true, dailyTasks: [] },
  ];
}

// ==================== 导航 ====================
// 侧边栏:每日计划 + 人生清单的每个目标(动态生成)
let PAGES = [{ id: 'plan', name: '每日计划', icon: '📋' }];

function rebuildPages() {
  initLifeList();
  const goals = getPageData('lifeList');
  PAGES = [{ id: 'plan', name: '每日计划', icon: '📋' }];
  goals.forEach((g, i) => {
    PAGES.push({
      id: 'goal_' + g.id,
      name: g.text,
      icon: g.done ? '✅' : '🎯',
      goalId: g.id,
    });
  });
}

let currentPage = 'plan';

function renderNav() {
  rebuildPages();
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map((p, i) => `
    <li class="nav-item ${p.id === currentPage ? 'active' : ''}" onclick="navigate('${p.id}')">
      <span class="nav-num">${i+1}</span>
      <span class="nav-label">${p.icon} ${p.name}</span>
    </li>
  `).join('');
}

function navigate(page) {
  currentPage = page;
  renderNav();
  renderPage();
  toggleSidebar(false);
  scrollToTop();
}

function scrollToTop() { window.scrollTo({top:0, behavior:'smooth'}); }

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (force === false) { sb.classList.remove('open'); ov.classList.remove('show'); return; }
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

// ==================== 页面渲染分发 ====================
function renderPage() {
  rebuildPages();
  const page = PAGES.find(p => p.id === currentPage);
  if (!page) { currentPage = 'plan'; return renderPage(); }
  document.getElementById('pageTitle').textContent = page.name;
  document.getElementById('pageDate').textContent = formatDate(new Date());
  const content = document.getElementById('content');
  // 如果是目标详情页
  if (currentPage.startsWith('goal_') && page.goalId) {
    content.innerHTML = renderGoalDetail(page.goalId);
  } else {
    const renderer = RENDERERS[currentPage];
    content.innerHTML = renderer ? renderer() : '<div class="empty">页面建设中</div>';
  }
  if (typeof AFTER_RENDER[currentPage] === 'function') AFTER_RENDER[currentPage]();
}

// 渲染目标详情页
function renderGoalDetail(goalId) {
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal) return '<div class="empty">目标不存在</div>';
  const progress = goal.done ? 100 : (goal.progress || 0);
  const checkins = goal.checkins || [];
  const todayCheckins = checkins.filter(c => c.date === todayStr());
  const todayAdded = todayCheckins.reduce((s,c) => s + c.add, 0);

  // 每日分解任务
  const dailyTasks = goal.dailyTasks || [];
  // 今日完成状态
  const todayDone = getPageData('goalDailyDone')[goalId] || {};
  const todayDoneCount = dailyTasks.filter(t => todayDone[t.id]).length;
  const allDone = dailyTasks.length > 0 && todayDoneCount === dailyTasks.length;

  let barColor = 'var(--accent)';
  if (progress >= 100) barColor = 'var(--success)';
  else if (progress >= 50) barColor = '#27AE60';

  const valueDisplay = (goal.currentValue || goal.targetValue) ?
    `<span style="font-size:14px;color:var(--text-muted)">${escapeHtml(goal.currentValue||'？')} → ${escapeHtml(goal.targetValue||'？')}</span>` : '';

  return `
    <div class="card" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border:1px solid var(--border)">
      <div style="font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px">${goal.done ? '✅' : '🎯'} ${escapeHtml(goal.text)}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <span style="font-size:36px;font-weight:800;color:${barColor}">${progress}%</span>
        ${valueDisplay}
      </div>
      <div class="progress-bar" style="height:14px;margin-top:10px"><div class="progress-fill" style="width:${progress}%;background:${barColor}"></div></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px">
        ${goal.deadline?'截止 '+goal.deadline:'无截止日期'} · ${goal.done?'已完成':'进行中'}
      </div>
      ${goal.note?`<div style="margin-top:8px;font-size:13px;color:var(--text-secondary)">📝 ${escapeHtml(goal.note)}</div>`:''}
    </div>

    ${todayAdded > 0 ? `
    <div class="card" style="text-align:center;background:var(--bg-card-hover)">
      <div style="font-size:13px;color:var(--text-muted)">今日已打卡</div>
      <div style="font-size:24px;font-weight:700;color:var(--success)">+${todayAdded}%</div>
    </div>` : ''}

    <!-- 每日分解任务 -->
    <div class="card">
      <div class="card-title">📋 每日该做什么 · ${todayStr()}</div>
      ${dailyTasks.length === 0 ? `
        <div class="empty"><div class="empty-icon">🌱</div>还没有分解每日任务<br>在下面添加吧</div>
      ` : `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px">
          今日完成 ${todayDoneCount}/${dailyTasks.length}
          ${dailyTasks.length > 0 ? `<span style="float:right">${Math.round(todayDoneCount/dailyTasks.length*100)}%</span>` : ''}
        </div>
        <div class="progress-bar" style="height:6px;margin-bottom:12px"><div class="progress-fill" style="width:${dailyTasks.length?todayDoneCount/dailyTasks.length*100:0}%"></div></div>
        ${dailyTasks.map(t => `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border-soft)">
            <div class="checkbox ${todayDone[t.id]?'checked':''}" onclick="toggleGoalDaily('${goalId}','${t.id}')" style="width:22px;height:22px"></div>
            <div style="flex:1;font-size:15px;color:var(--text-primary);${todayDone[t.id]?'text-decoration:line-through;opacity:0.5':''}">${escapeHtml(t.text)}</div>
            <button onclick="deleteDailyTask('${goalId}','${t.id}')" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:0 4px">×</button>
          </div>

    </div>`}

    <!-- 打卡记录 -->

      <div class="card-title">📅 打卡记录</div>
      ${checkins.length === 0 ? '<div class="empty">还没有打卡记录</div>' :
      `<div>${checkins.slice(-15).reverse().map(c => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border-soft)">
          <div style="font-size:18px">📅</div>

// 添加每日分解任务
function addDailyTask(goalId) {
  const input = document.getElementById('dailyTaskInput');
  const rewardInput = document.getElementById('dailyTaskReward');
  const text = input.value.trim();
  if (!text) { toast('请填写任务内容'); return; }
  const reward = parseInt(rewardInput.value) || 1;
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal) return;
  if (!goal.dailyTasks) goal.dailyTasks = [];
  goal.dailyTasks.push({ id: uid(), text, reward });
  setPageData('lifeList', goals);
  renderPage();
  toast('已添加每日任务');
}

// 删除每日分解任务
function deleteDailyTask(goalId, taskId) {
  if (!confirm('删除这个每日任务吗?')) return;
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal || !goal.dailyTasks) return;
  goal.dailyTasks = goal.dailyTasks.filter(t => t.id !== taskId);
  setPageData('lifeList', goals);
  renderPage();
  toast('已删除');
}

// 勾选/取消每日任务
function toggleGoalDaily(goalId, taskId) {
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal || goal.done) return;
  const task = (goal.dailyTasks || []).find(t => t.id === taskId);
  if (!task) return;

  // 读取今日完成状态
  const allDone = getPageData('goalDailyDone');
  const done = allDone[goalId] || {};
  const wasDone = !!done[taskId];

  if (!wasDone) {
    // 完成 → 加进度
    done[taskId] = true;
    allDone[goalId] = done;
    setPageData('goalDailyDone', allDone);

    const oldProgress = goal.progress || 0;
    const newProgress = Math.min(100, oldProgress + (task.reward || 1));
    const actualAdd = newProgress - oldProgress;
    goal.progress = newProgress;
    if (!goal.checkins) goal.checkins = [];
    goal.checkins.push({ date: todayStr(), time: new Date().toTimeString().slice(0,5), add: actualAdd, total: newProgress });
    if (newProgress >= 100) goal.done = true;
    setPageData('lifeList', goals);

    if (newProgress >= 100) toast('🎉 目标完成!');
    else toast(`✅ ${task.text} +${actualAdd}% → ${newProgress}%`);
  } else {
    // 取消完成 → 扣进度
    done[taskId] = false;
    allDone[goalId] = done;
    setPageData('goalDailyDone', allDone);

    const oldProgress = goal.progress || 0;
    const newProgress = Math.max(0, oldProgress - (task.reward || 1));
    goal.progress = newProgress;
    setPageData('lifeList', goals);
    toast('已取消,进度已扣回');
  }
  renderPage();
}

// 快速打卡
function quickCheckin(goalId, add) {
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal || goal.done) return;
  const oldProgress = goal.progress || 0;
  const newProgress = Math.min(100, oldProgress + add);
  const actualAdd = newProgress - oldProgress;
  if (actualAdd <= 0) { toast('进度已满!'); return; }
  goal.progress = newProgress;
  if (!goal.checkins) goal.checkins = [];
  goal.checkins.push({ date: todayStr(), time: new Date().toTimeString().slice(0,5), add: actualAdd, total: newProgress });
  if (newProgress >= 100) goal.done = true;
  setPageData('lifeList', goals);
  renderPage();
  if (newProgress >= 100) toast('🎉 恭喜完成!');
  else toast(`打卡成功!+${actualAdd}% → ${newProgress}%`);
}

function customCheckin(goalId) {
  const goals = getPageData('lifeList');
  const goal = goals.find(g => g.id === goalId);
  if (!goal) return;
  const input = prompt(`输入本次打卡进度(当前 ${goal.progress||0}%)`, '3');
  if (input === null) return;
  const add = parseInt(input) || 0;
  if (add <= 0) { toast('请输入大于0的数字'); return; }
  quickCheckin(goalId, add);
}

// 添加关联目标的任务
function addGoalPlan(goalId) {
  const input = document.getElementById('goalPlanInput');
  const timeInput = document.getElementById('goalPlanTime');
  const rewardInput = document.getElementById('goalPlanReward');
  const text = input.value.trim();
  if (!text) { toast('请填写任务内容'); return; }
  const list = getPageData('plan');
  list.push({
    id: uid(),
    text,
    done: false,
    date: todayStr(),
    time: timeInput.value || '',
    emoji: '📌',
    category: '其他',
    goalId: goalId,
    reward: parseInt(rewardInput.value) || 0,
  });
  setPageData('plan', list);
  input.value = '';
  renderPage();
  toast('已添加任务');
}

// 勾选关联目标的任务 → 自动给目标加进度
function toggleGoalPlan(planId, goalId) {
  const list = getPageData('plan');
  const item = list.find(x => x.id === planId);
  if (!item) return;
  const wasDone = item.done;
  item.done = !wasDone;
  setPageData('plan', list);

  // 如果是完成动作,且有奖励进度,自动给目标加进度
  if (item.done && !wasDone && item.reward && item.reward > 0) {
    const goals = getPageData('lifeList');
    const goal = goals.find(g => g.id === goalId);
    if (goal && !goal.done) {
      const oldProgress = goal.progress || 0;
      goal.progress = Math.min(100, oldProgress + item.reward);
      if (!goal.checkins) goal.checkins = [];
      goal.checkins.push({ date: todayStr(), time: new Date().toTimeString().slice(0,5), add: item.reward, total: goal.progress });
      if (goal.progress >= 100) goal.done = true;
      setPageData('lifeList', goals);
      if (goal.progress >= 100) toast('🎉 目标完成!');
      else toast(`✅ 任务完成!${goal.text} +${item.reward}% → ${goal.progress}%`);
    }
  } else if (!item.done && wasDone && item.reward && item.reward > 0) {
    // 取消完成,扣回进度
    const goals = getPageData('lifeList');
    const goal = goals.find(g => g.id === goalId);
    if (goal && !goal.done) {
      goal.progress = Math.max(0, (goal.progress || 0) - item.reward);
      setPageData('lifeList', goals);
      toast('已取消,进度已扣回');
    }
  }
  renderPage();
}

function deleteGoalPlan(planId, goalId) {
  if (!confirm('确定删除这条任务吗?')) return;
  let list = getPageData('plan');
  list = list.filter(x => x.id !== planId);
  setPageData('plan', list);
  renderPage();
  toast('已删除');
}

function formatDate(d) {
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${days[d.getDay()]}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ==================== 通用渲染辅助 ====================
function renderList(arr, renderFn) {
  if (!arr || arr.length === 0) {
    return `<div class="empty"><div class="empty-icon">🍃</div>暂无记录</div>`;
  }
  return arr.slice().reverse().map(renderFn).join('');
}
function renderListKeepOrder(arr, renderFn) {
  if (!arr || arr.length === 0) {
    return `<div class="empty"><div class="empty-icon">🍃</div>暂无记录</div>`;
  }
  return arr.slice().map(renderFn).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 按时间段分组渲染
function renderTimelineGrouped(today) {
  const groups = [
    { name: '🌅 早晨', range: '05:00-11:59', items: [] },
    { name: '☀️ 中午', range: '12:00-13:59', items: [] },
    { name: '🌤️ 下午', range: '14:00-17:59', items: [] },
    { name: '🌙 晚上', range: '18:00-23:59', items: [] },
    { name: '🕒 未安排时间', range: '', items: [] },
  ];
  today.forEach(item => {
    const t = item.time || '';
    if (!t) { groups[4].items.push(item); return; }
    const hour = parseInt(t.split(':')[0]);
    if (hour < 12) groups[0].items.push(item);
    else if (hour < 14) groups[1].items.push(item);
    else if (hour < 18) groups[2].items.push(item);
    else groups[3].items.push(item);
  });
  groups.forEach(g => g.items.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99')));
  return groups.map(g => {
    if (g.items.length === 0) return '';
    return `
      <div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--border)">
          <span style="font-size:15px;font-weight:700;color:var(--accent)">${g.name}</span>
          <span style="font-size:11px;color:var(--text-muted)">${g.range}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${g.items.filter(x=>x.done).length}/${g.items.length}</span>
        </div>
        ${g.items.map(item => renderTimelineItem(item)).join('')}
      </div>
    `;
  }).join('');
}

function renderLifeListItem(item) {

  // 进度条颜色:根据进度变化

      <b>打卡记录(${item.checkins.length}次):</b><br>

            <div class="list-item-title ${isDone?'completed-text':''}">${escapeHtml(item.text)} <span class="tag">${escapeHtml(cat)}</span></div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:18px;font-weight:700;color:${barColor}">${displayProgress}%</span>
            </div>
          </div>
          <div class="list-item-meta">${item.date} ${item.deadline?'· 截止 '+item.deadline:''} ${valueDisplay}</div>
          ${item.note?`<div class="list-item-body" style="color:var(--text-secondary)">📝 ${escapeHtml(item.note)}</div>`:''}
          <!-- 独立进度条 -->
          <div style="margin-top:10px">
            <div class="progress-bar" style="height:10px"><div class="progress-fill" style="width:${displayProgress}%;background:${barColor}"></div></div>
          </div>
          ${checkinHistory}
          <!-- 操作按钮 -->
          <div style="display:flex;gap:8px;margin-top:10px">
            ${!isDone ? `<button class="btn btn-sm" onclick="checkinLifeList('${item.id}')">📅 打卡</button>` : '<span style="font-size:12px;color:var(--success);padding:6px 0">✅ 已完成</span>'}
            <button class="btn btn-sm btn-outline" onclick="editLifeListProgress('${item.id}')">修改进度</button>
            <button class="btn btn-sm btn-outline" style="margin-left:auto;color:var(--danger);border-color:var(--danger)" onclick="deleteLifeList('${item.id}')">删除</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function editLifeListProgress(id) {
  const list = getPageData('lifeList');
  const item = list.find(x => x.id === id);
  if (!item) return;
  const input = prompt(`修改进度(0-100):`, item.progress || 0);
  if (input === null) return;
  const val = Math.max(0, Math.min(100, parseInt(input) || 0));
  item.progress = val;
  if (val >= 100) item.done = true;
  else item.done = false;
  setPageData('lifeList', list);
  renderPage();
  toast('进度已更新');
}
function addLifeList() {
  const text = document.getElementById('llText').value.trim();
  const category = document.getElementById('llCategory').value;
  const deadline = document.getElementById('llDeadline').value;
  const note = document.getElementById('llNote').value.trim();
  const progress = parseInt(document.getElementById('llCurrent').value) || 0;
  const currentValue = document.getElementById('llCurrentValue').value.trim();
  const targetValue = document.getElementById('llTargetValue').value.trim();
  if (!text) { toast('请填写目标'); return; }
  const list = getPageData('lifeList');
  const done = progress >= 100;
  list.push({ id: uid(), text, category, deadline, note, progress, currentValue, targetValue, done, date: todayStr() });
  setPageData('lifeList', list);
  renderPage();
  toast('已添加目标');

function toggleLifeList(id) {
  const list = getPageData('lifeList');
  const item = list.find(x => x.id === id);
  if (item) {
    item.done = !item.done;
    if (item.done) item.progress = 100;
    else if (item.progress >= 100) item.progress = 90;
  }
  setPageData('lifeList', list);
  renderPage();
  toast(item.done ? '🎉 恭喜完成一项!' : '已取消完成');

function deleteLifeList(id) {
  if (!confirm('确定要删除这个目标吗?删除后无法恢复。')) return;
  let list = getPageData('lifeList');

  toast('已删除');
}
// 打卡:弹窗输入本次完成的进度增量
function checkinLifeList(id) {
  const list = getPageData('lifeList');
  const item = list.find(x => x.id === id);
  if (!item) return;
  const current = item.progress || 0;
  const input = prompt(`打卡:本次完成了多少?(输入0-100的数字)\n当前进度:${current}%\n例如:存了1w就输入2(代表+2%)`, '');
  if (input === null) return;
  const add = parseInt(input) || 0;
  if (add <= 0) { toast('请输入大于0的数字'); return; }
  const newProgress = Math.min(100, current + add);
  item.progress = newProgress;
  // 记录打卡历史
  if (!item.checkins) item.checkins = [];
  item.checkins.push({ date: todayStr(), time: new Date().toTimeString().slice(0,5), add: add, total: newProgress });
  if (newProgress >= 100) item.done = true;
  setPageData('lifeList', list);
  renderPage();
  if (newProgress >= 100) toast('🎉 恭喜完成!');
  else toast(`打卡成功!+${add}% → ${newProgress}%`);
}

// ---------- 7. 运动打卡 ----------
RENDERERS.exercise = function() {
  const list = getPageData('exercise');
  // 本周打卡
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const weekList = list.filter(x => new Date(x.date) >= weekStart);
  const totalMin = weekList.reduce((s,x)=>s+(parseInt(x.duration)||0),0);
  const types = {};
  weekList.forEach(x => { types[x.type] = (types[x.type]||0)+1; });
  const typeStr = Object.entries(types).map(([k,v])=>`${k}×${v}`).join(' ') || '暂无';
  // 连续打卡
  let streak = 0;
  const dates = [...new Set(list.map(x=>x.date))].sort().reverse();
  if (dates.length) {
    let d = new Date();
    for (;;) {
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (dates.includes(ds)) { streak++; d.setDate(d.getDate()-1); }
      else break;
    }
  }
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-label">连续打卡(天)</div></div>
      <div class="stat-card"><div class="stat-num">${weekList.length}</div><div class="stat-label">本周次数</div></div>
      <div class="stat-card"><div class="stat-num">${totalMin}</div><div class="stat-label">本周时长(分)</div></div>
    </div>
    <div class="card">
      <div class="card-title">运动打卡 · ${todayStr()}</div>
      <div class="grid-3">
        <div><label class="label">运动类型</label>
          <select class="select" id="exType">
            <option>跑步</option><option>健身</option><option>瑜伽</option><option>骑行</option>
            <option>游泳</option><option>球类</option><option>散步</option><option>其他</option>
          </select>
        </div>
        <div><label class="label">时长(分钟)</label><input class="input" id="exDuration" type="number" value="30"></div>
        <div><label class="label">强度</label>
          <select class="select" id="exIntensity">
            <option>轻松</option><option>适中</option><option>高强度</option>
          </select>
        </div>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div><label class="label">距离/组数(可选)</label><input class="input" id="exAmount" placeholder="如 5km / 4组"></div>
        <div><label class="label">日期</label><input class="input" id="exDate" type="date" value="${todayStr()}"></div>
      </div>
      <div style="margin-top:12px"><label class="label">感受</label><textarea class="textarea" id="exFeel" placeholder="运动后状态如何?"></textarea></div>
      <div style="margin-top:12px"><button class="btn" onclick="addExercise()">打卡</button></div>
    </div>
    <div class="card">
      <div class="card-title">本周运动 · ${typeStr}</div>
      <div id="exWeekList">${renderList(weekList, renderExerciseItem)}</div>
    </div>
    <div class="card">
      <div class="card-title">全部记录</div>
      <div id="exAllList">${renderList(list.filter(x=>!weekList.includes(x)), renderExerciseItem)}</div>
    </div>
  `;
};
function renderExerciseItem(item) {
  return `
    <div class="list-item">
      <div style="font-size:24px">${getExIcon(item.type)}</div>
      <div class="list-item-content">
        <div class="list-item-title">${escapeHtml(item.type)} · ${escapeHtml(item.duration||0)}分钟 <span class="tag">${escapeHtml(item.intensity||'')}</span></div>
        <div class="list-item-meta">${item.date} ${item.amount?'· '+escapeHtml(item.amount):''}</div>

        <div><label class="label">周评分 (1-10)</label><input class="input" id="wkScore" type="number" min="1" max="10" value="7"></div>
      </div>
      <div style="margin-top:12px"><label class="label">本周目标回顾</label><textarea class="textarea" id="wkGoals" placeholder="上周定的目标完成得怎样?"></textarea></div>
      <div style="margin-top:12px"><label class="label">关键成果 & 高光时刻</label><textarea class="textarea" id="wkWins" placeholder="这周最值得骄傲的事..."></textarea></div>
      <div style="margin-top:12px"><label class="label">遗憾 & 反思</label><textarea class="textarea" id="wkRegrets" placeholder="哪些没做好?为什么?"></textarea></div>
      <div style="margin-top:12px"><label class="label">成长与收获</label><textarea class="textarea" id="wkGrowth" placeholder="学到了什么?有什么新认知?"></textarea></div>
      <div style="margin-top:12px"><label class="label">下周计划</label><textarea class="textarea" id="wkNext" placeholder="下周要聚焦什么?"></textarea></div>
      <div style="margin-top:12px"><button class="btn" onclick="addWeekReview()">保存周复盘</button></div>
    </div>
    <div class="card">
      <div class="card-title">周复盘档案</div>
      <div id="wkList">${renderList(list, renderWeekItem)}</div>
    </div>
  `;
};
function renderWeekItem(item) {
  return `
    <div class="list-item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <span class="list-item-title">${escapeHtml(item.theme||'周复盘')}</span>
          <div class="list-item-meta">${item.date}</div>
        </div>
        <span class="tag tag-dark">${escapeHtml(item.score||'')}/10</span>
      </div>
      ${item.goals?`<div class="list-item-body"><b>目标回顾:</b><br>${escapeHtml(item.goals)}</div>`:''}
      ${item.wins?`<div class="list-item-body"><b>高光时刻:</b><br>${escapeHtml(item.wins)}</div>`:''}
      ${item.regrets?`<div class="list-item-body"><b>遗憾反思:</b><br>${escapeHtml(item.regrets)}</div>`:''}
      ${item.growth?`<div class="list-item-body"><b>成长收获:</b><br>${escapeHtml(item.growth)}</div>`:''}
      ${item.next?`<div class="list-item-body"><b>下周计划:</b><br>${escapeHtml(item.next)}</div>`:''}
      <div style="text-align:right;margin-top:6px"><button class="delete-btn" onclick="deleteWeekReview('${item.id}')">×</button></div>
    </div>
  `;
}
function addWeekReview() {
  const theme = document.getElementById('wkTheme').value.trim();
  const score = document.getElementById('wkScore').value;
  const goals = document.getElementById('wkGoals').value.trim();
  const wins = document.getElementById('wkWins').value.trim();
  const regrets = document.getElementById('wkRegrets').value.trim();
  const growth = document.getElementById('wkGrowth').value.trim();
  const next = document.getElementById('wkNext').value.trim();
  if (!theme && !goals) { toast('请至少填写主题或目标回顾'); return; }
  const list = getPageData('weekReview');
  list.push({ id: uid(), theme, score, goals, wins, regrets, growth, next, date: todayStr() });
  setPageData('weekReview', list);
  renderPage();
  toast('周复盘已保存');
}
function deleteWeekReview(id) {
  let list = getPageData('weekReview');
  list = list.filter(x => x.id !== id);
  setPageData('weekReview', list);
  renderPage();
}

// ==================== 工具函数 ====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ==================== 导入导出 ====================
function exportData() {
  const data = loadData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `星澈工作台_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出全部数据');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('导入会覆盖当前所有数据,确定继续吗?')) {
        saveData(data);
        renderPage();
        toast('导入成功');
      }
    } catch(err) {
      toast('文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== PWA 注册 ====================
if ('serviceWorker' in navigator) {
  // 使用内联 service worker (通过 Blob)
  const swCode = `
    const CACHE = 'xingche-v1';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          if (res && res.status === 200 && e.request.method === 'GET') {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return res;
        }).catch(() => caches.match(e.request)))
      );
    });
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  // 注意:某些浏览器不允许 blob SW,这里做容错
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// 提示添加到桌面
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => {
    if (!localStorage.getItem('pwa_prompted')) {
      toast('💡 点击顶部"添加到主屏幕"可装到手机桌面');
      localStorage.setItem('pwa_prompted', '1');
    }
  }, 3000);
});

// ==================== 初始化 ====================
initLifeList();
renderNav();
renderPage();

// iOS 双击缩放禁止
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
